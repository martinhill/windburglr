name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The test jobs run inside the flake's dev shells, so CI uses the same Python, uv, Node and
# PostgreSQL/TimescaleDB as local development, and the same scripts/db.sh database setup.

jobs:
  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
        shell: nix develop ..#scraper --command bash -eo pipefail {0}
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v6
        with:
          path: /tmp/uv-cache
          key: uv-scraper-${{ hashFiles('scraper/uv.lock') }}
      - run: uv sync --locked
      - run: ../scripts/db.sh up
      - run: uv run ruff check .
      - run: uv run pytest --no-cov

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
        shell: nix develop ..#webapp --command bash -eo pipefail {0}
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v6
        with:
          path: |
            /tmp/uv-cache
            ~/.npm
          key: uv-webapp-${{ hashFiles('webapp/uv.lock', 'webapp/package-lock.json') }}
      - run: uv sync --locked
      - run: npm ci
      - run: ../scripts/db.sh up
      - run: uv run ruff check .
      - name: Frontend tests
        run: npm run test:run
      # The app mounts dist/ at import time, so the Python tests need a frontend build
      - name: Build frontend
        run: npm run build
      - name: Python tests
        run: uv run pytest tests/unit tests/integration --no-cov

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scraper, webapp]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          build-args: SENTRY_RELEASE=${{ github.sha }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
