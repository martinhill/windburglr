name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Apps to deploy after the checks pass (master only)
        type: choice
        options: [none, scraper, webapp, both]
        default: none

# Superseded PR runs are cancelled; runs on master queue instead, so a deploy is never
# interrupted
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Pushes to master deploy the apps whose directories changed, once every check has passed.

# The test jobs run inside the flake's dev shells, so CI uses the same Python, uv, Node and
# PostgreSQL/TimescaleDB as local development, and the same scripts/db.sh database setup.

jobs:
  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
        shell: nix develop ..#scraper --command bash -eo pipefail {0}
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v6
        with:
          path: /tmp/uv-cache
          key: uv-scraper-${{ hashFiles('scraper/uv.lock') }}
      - run: uv sync --locked
      - run: ../scripts/db.sh up
      - run: uv run ruff check .
      - run: uv run pytest --no-cov

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
        shell: nix develop ..#webapp --command bash -eo pipefail {0}
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v6
        with:
          path: |
            /tmp/uv-cache
            ~/.npm
          key: uv-webapp-${{ hashFiles('webapp/uv.lock', 'webapp/package-lock.json') }}
      - run: uv sync --locked
      - run: npm ci
      - run: ../scripts/db.sh up
      - run: uv run ruff check .
      - name: Frontend tests
        run: npm run test:run
      # The app mounts dist/ at import time, so the Python tests need a frontend build
      - name: Build frontend
        run: npm run build
      - name: Python tests
        run: uv run pytest tests/unit tests/integration --no-cov

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scraper, webapp]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          build-args: SENTRY_RELEASE=${{ github.sha }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Which apps to deploy: those changed by a push to master, or the manual choice
  changes:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            scraper: scraper/**
            webapp: webapp/**
      - id: apps
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.deploy }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          case "$EVENT:$CHOICE" in
            push:*) apps="$CHANGED" ;;
            *:both) apps='["scraper","webapp"]' ;;
            *:scraper|*:webapp) apps="[\"$CHOICE\"]" ;;
            *) apps='[]' ;;
          esac
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Deploying: $apps"

  deploy:
    needs: [changes, scraper, webapp, docker]
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy ${{ matrix.app }}
        run: ${{ matrix.app }}/fly-deploy.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
